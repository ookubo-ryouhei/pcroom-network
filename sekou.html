<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>施工と検査｜PC教室の配線</title>
<style>:root{--ink:#1B2430;--sub:#566070;--muted:#7D8693;--line:#E3E6EA;--line2:#CDD3DA;--bg:#F4F5F7;--card:#fff;--navy:#17324E;--teal:#0E7C7B;--teal-bg:#E3F1F0;--amber:#C8851A;--amber-t:#8A5200;--amber-bg:#FBF0DC;--red:#B3261E;--red-bg:#FBEAE8;--green:#2C7A4B;--green-bg:#E4F2E9;--r:0;--sh:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.75;font-feature-settings:"palt" 1}
.num{font-variant-numeric:tabular-nums}
a{color:var(--navy)}
.appbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand img{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:16px;color:var(--navy);line-height:1.3;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--sub)}
.steps{display:flex;gap:0;margin:0 auto;flex-wrap:wrap;justify-content:center}
.steps button{margin-left:-1px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:#fff;border-radius:0;padding:5px 14px 5px 5px;min-height:42px;font-size:14px;color:var(--ink)}
.steps .n{width:28px;height:28px;border-radius:0;display:grid;place-items:center;background:#EEF0F2;color:var(--sub);font-size:13px;font-weight:600}
.steps .n svg{width:16px;height:16px}
.steps button.done .n{background:var(--green);color:#fff}
.steps button[aria-current=step]{border-color:var(--navy);background:var(--navy);color:#fff}
.steps button[aria-current=step] .n{background:#fff;color:var(--navy)}
main{max-width:1280px;margin:0 auto;padding:18px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:0;box-shadow:var(--sh);padding:18px 20px}
h1,h2,h3{margin:0;line-height:1.45}
h1{font-size:22px;color:var(--navy)}
h2{font-size:16px;color:var(--navy);font-weight:600}
h3{font-size:14px;color:var(--navy);font-weight:600}
p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:600}
.sub{color:var(--sub);font-size:13px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:960px){.work{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.mapcard{padding:10px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 10px;margin-bottom:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.map svg{display:block;width:100%;height:auto;border-radius:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px;border-radius:0;background:#F1F3F5;border-top:1px solid var(--line2)}
.toolbar .hint{flex:1 1 220px;font-size:13px;color:var(--sub);padding:0 6px;min-height:1.7em}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;padding:0 6px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:0;vertical-align:-1px;margin-right:4px;border:1.5px solid}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:2px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;font-weight:500;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover:not(:disabled){background:#0F2740}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:0;background:#EEF0F3;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.result{border-radius:0;padding:14px 16px;margin-top:14px;border:1px solid;border-left-width:4px}
.result.ok{background:var(--green-bg);border-color:#BFDFCB;border-left-color:var(--green)}
.result.ng{background:var(--red-bg);border-color:#F0C9C4;border-left-color:var(--red)}
.result .rh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.result .rh svg{width:20px;height:20px;flex:none}
.result.ok .rh{color:var(--green)}
.result.ng .rh{color:var(--red)}
.result .rb{margin-top:4px;font-size:14px}
.result .btn{margin-top:12px}
.point{margin-top:10px;padding:10px 12px;border-radius:0;background:rgba(255,255,255,.8);font-size:13.5px}
.point b{color:var(--navy)}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #EEF0F3;font-size:13.5px}
.list li:last-child{border-bottom:0}
.list .lock{color:var(--muted);font-size:12px;white-space:nowrap}
.list .btn{min-height:38px;padding:4px 12px;border-radius:0;font-size:13px}
.list .btn[aria-pressed=true]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-t)}
details.card>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin:0 4px 4px auto}
details.card[open]>summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.question{margin-top:18px;border-left:6px solid #0E7C7B;border-radius:0;padding:22px 24px;background:var(--navy);color:#fff}
.question .lb{font-size:12px;letter-spacing:.1em;opacity:.8}
.question .q{font-size:19px;font-weight:600;margin-top:4px;line-height:1.6}
.record{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#F6F7F9;border-radius:0;padding:12px 14px;border:1px solid var(--line);margin:10px 0 12px}
.dg{width:100%;height:auto;display:block;margin-top:8px}
.dg .dl path{fill:none;stroke:#5A6472;stroke-width:1.3}
.dg rect{fill:#fff;stroke:#5A6472;stroke-width:1.2}
.dg rect.hb{fill:#E3F1F0;stroke:#0E7C7B}
.dg text{font-size:11px;text-anchor:middle;fill:#1B2430}
.dg .ann{text-anchor:start;fill:#566070;font-size:10.5px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:0;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 見取り図 */
.cabcase{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:butt;stroke-linejoin:round}
.cab{fill:none;stroke:#0E7C7B;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.cab.locked{stroke:#6E7986}
.cab.mark{stroke:#C8851A;stroke-width:7}
.cab.bad{stroke:#B3261E;stroke-width:6;stroke-dasharray:10 7}
.flowline{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:2 16;animation:flow 1.4s linear infinite;opacity:.95;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-36}}
.cabhit{fill:none;stroke:transparent;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.node{cursor:pointer;outline:none}
.node .hit{fill:transparent}
.node .ring{fill:none;stroke:transparent;stroke-width:3}
.node.cand .ring{stroke:#0E7C7B;stroke-dasharray:7 5;fill:rgba(14,124,123,.06)}
.node.sel .ring{stroke:#C8851A;stroke-dasharray:none;stroke-width:4;fill:rgba(200,133,26,.12)}
.node.failed .ring{stroke:#B3261E}
.node:focus-visible .ring{stroke:#0E7C7B;stroke-width:4}
.node.fixed{cursor:default}
.lbl{font-size:19px;font-weight:600;fill:#1B2430;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.lbl.sm{font-size:16px}
.pill rect{fill:#fff;stroke:#C4CBD3}
.pill text{font-size:17px;font-weight:700;fill:#1B2430}
.lamp{stroke:#fff;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pop .35s both;animation-delay:var(--d,0ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.dimmed{fill:#F6F7F9;opacity:.82}
.stoptag rect{fill:#B3261E}
.stoptag text{fill:#fff;font-size:16px;font-weight:700}
@media(prefers-reduced-motion:reduce){.flowline,.lamp{animation:none}#toast{transition:none}}

.guide{border:1px solid var(--line2);margin-bottom:10px;background:#fff}
.guide ol{display:flex;margin:0;padding:0;list-style:none;border-bottom:1px solid var(--line2)}
.guide li{flex:1 1 0;display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:13px;line-height:1.45;color:var(--sub);border-left:1px solid var(--line2)}
.guide li:first-child{border-left:0}
.guide li .k{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line2);font-weight:700;font-size:12px;background:#fff}
.guide li.on{background:var(--navy);color:#fff;font-weight:600}
.guide li.on .k{color:var(--navy);border-color:#fff}
.guide .hint{padding:9px 12px;font-size:14px;color:var(--ink);min-height:calc(3.2em + 18px);box-sizing:border-box;background:#F8F9FA;line-height:1.6}
.todo{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:t}
.todo li{counter-increment:t;position:relative;padding:6px 0 6px 34px;border-top:1px solid var(--line);font-size:14px;line-height:1.6}
.todo li:first-child{border-top:0}
.todo li::before{content:counter(t);position:absolute;left:0;top:7px;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--navy);color:var(--navy);font-weight:700;font-size:12px}

/* 1画面に収める工夫 */
.narrow-only{display:none}
@media(min-width:961px){.stack.sticky{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;scrollbar-width:thin}}
@media(max-width:960px){.narrow-only{display:inline-flex;margin-left:auto}
 body.m-mark #dgcard{order:-1}
 .stack .dg{max-width:460px;margin-left:auto;margin-right:auto}}
.list.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:16px}
.list.cols li:last-child{border-bottom:1px solid #EEF0F3}
@media(min-width:961px){.guide .hint{min-height:calc(1.6em + 18px)}
 .mapcard .map svg{max-height:calc(100vh - 340px);min-height:420px;width:auto;max-width:100%;margin:0 auto}}
body.m-mark .legend{display:none}
body.m-mark .guide .hint{min-height:0}
@media(max-width:960px){body.m-mark .mapcard .map svg{max-height:calc(100vh - 680px);min-height:440px;width:auto;max-width:100%;margin:0 auto}}
/* 練習中は、次にタップする機器をゆっくり点滅させて強調する */
body.m-practice .node.cand .ring{stroke-width:4;animation:candblink 1.4s ease-in-out infinite}
@keyframes candblink{50%{stroke-opacity:.25}}
@media(prefers-reduced-motion:reduce){body.m-practice .node.cand .ring{animation:none}}
/* 設計完了などのポップアップ */
dialog.pop{border:1px solid #C9CED6;border-top:4px solid #16324F;border-radius:0;padding:24px;max-width:520px;width:calc(100% - 40px);color:inherit;box-shadow:0 12px 40px rgba(20,30,45,.18)}
dialog.pop::backdrop{background:rgba(20,30,45,.45)}
.popstep{display:flex;align-items:center;gap:10px;font-weight:700}
.popstep span{padding:6px 12px;border:1px solid #C9CED6;color:#5A6472}
.popstep span.on{background:#16324F;border-color:#16324F;color:#fff}
.popstep .ar{border:none;padding:0}
.popbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
</style></head><body>
<header class="appbar">
 <a class="brand" href="index.html"><img src="images/mark.svg" alt=""><div><b>PC教室の配線</b><span>施工と検査</span></div></a>
 <nav class="steps" id="steps" aria-label="仕事の一覧"></nav>
 <a class="btn ghost" href="#done">学習の記録</a>
</header>
<main>
 <div class="work">
  <section class="card mapcard" aria-labelledby="maph">
   <div class="cardhead"><h2 id="maph">PC教室の見取り図（架空の教室）</h2><div class="chips" id="stats"></div></div>
   <div class="guide"><div id="guideSteps"></div><p class="hint" id="hint" aria-live="polite"></p></div>
   <div id="room" class="map"></div>
   <div class="toolbar">
    <button class="btn" id="undo"></button>
    <button class="btn hidden" id="desel">選択を解除</button>
    <button class="btn hidden" id="cut"></button>
    <button class="btn hidden" id="clearMarks">印をすべて消す</button>
    <button class="btn hidden" id="skip2">練習をスキップ</button>
    <button class="btn primary narrow-only" id="act2"></button>
   </div>
   <div class="legend"><span><i style="background:#0E7C7B;border-color:#0E7C7B"></i>使用中のポート</span><span><i style="background:#fff;border-color:#9AA3AD"></i>空きポート</span><span><i style="background:#2C7A4B;border-color:#2C7A4B"></i>接続できた</span><span><i style="background:#B3261E;border-color:#B3261E"></i>接続できない</span><span>列ハブは横列ごとのハブです。机の番号は「横列-左からの順」です。机の中の小さなハブで、PC4台を机の配線口にまとめてあります。</span></div>
  </section>
  <div class="stack sticky">
   <section class="card" id="mission"></section>
   <section class="card" id="dgcard" aria-labelledby="dgh"><h2 id="dgh">ネットワーク図（図面）</h2><div id="diagram"></div><p class="sub" style="margin-top:6px">線は、LANケーブルで直接接続する機器同士を表します。</p></section>
   <details class="card" id="cabcard"><summary><h2>ケーブル一覧</h2><span class="chip num" id="cabcount"></span></summary><p class="sub" style="margin-top:6px" id="cabnote"></p><ul class="list cols" id="cables"></ul></details>
  </div>
 </div>
 <section class="card" id="done" style="margin-top:16px" aria-labelledby="doneh"><div class="eyebrow">学習の記録</div><h2 id="doneh"></h2><pre class="record" id="rec"></pre><button class="btn primary" id="copy"></button></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const SEATX=[310,510,710],LINEY=[298,428,558,688],HUBX=110,VH=790,M_PER_PX=12/940;
const ICONS={
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
 cut:'<path d="M6 6l12 12M18 6L6 18"/>',
 bolt:'<path d="M13 3L5 13.5h6L10 21l9-11.5h-6L13 3z"/>',
 reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="0"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 back:'<path d="M15 6l-6 6 6 6"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function resultHTML(ok,title,body,point,extra){return `<div class="result ${ok?'ok':'ng'}" role="status"><div class="rh">${icon(ok?'check':'alert')}<span>${title}</span></div><div class="rb">${body}</div>${point?`<div class="point">${point}</div>`:''}${extra||''}</div>`;}
async function copyText(text,el){try{await navigator.clipboard.writeText(text);toast('記録をコピーしました。');}catch(e){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('記録を選択しました。長押しでコピーしてください。');}catch(e2){toast('コピーできませんでした。記録を長押ししてコピーしてください。');}}}

/* ---- 機器の配置 ---- */
function makeNodes(counts,rack){
 const N={
  R:{x:915,y:rack?54:74,type:'router',name:'ルータ',ports:4,w:84,h:51,img:'router'},
  M:rack?{x:915,y:116,type:'main',name:'主ハブ',ports:8,w:66,h:22,img:'hub8top'}:{x:480,y:166,type:'main',name:'主ハブ',ports:8,w:66,h:22,img:'hub8top'},
  T:{x:480,y:86,type:'teacher',name:'教師用PC',ports:1,w:150,h:46,img:'teacherdesk'},
  P:{x:92,y:84,type:'printer',name:'プリンタ',ports:1,w:76,h:57,img:'printer'}};
 counts.forEach((n,i)=>{const c=i+1,y=LINEY[i];N['H'+c]={x:HUBX,y,type:'hub',name:c+'列目ハブ',ports:5,w:60,h:20,img:'hubtop',line:c};
  for(let s=1;s<=n;s++)N['D'+c+s]={x:SEATX[s-1],y,type:'desk',name:'机'+c+'-'+s,label:c+'-'+s,ports:1,w:150,h:96,img:'desk4',seat:s-1,line:c,pcs:4};});
 return N;}
function portPos(n,i){
 if(n.type==='desk')return[n.x,n.y+41];
 if(n.type==='teacher')return[n.x,n.y+23];
 if(n.type==='printer')return[n.x+28,n.y+6];
 const sp=n.type==='main'?7.5:9,x0=n.x-(n.ports-1)*sp/2;return[x0+Math.min(i,n.ports-1)*sp,n.y+n.h/2+6];}
const FRONT=t=>t==='router'||t==='main'||t==='teacher'||t==='printer';
function portMap(N,edges){const P={},cnt={};for(const id in N){P[id]={};cnt[id]=0;}edges.forEach(k=>k.split('|').forEach(id=>{P[id][k]=portPos(N[id],cnt[id]++);}));return{P,cnt};}
function route(N,k,P){const[a,b]=k.split('|'),A=N[a],B=N[b],pa=P[a][k],pb=P[b][k];
 if(A.type==='desk'||B.type==='desk'){const dI=A.type==='desk'?a:b,oI=dI===a?b:a,d=N[dI],on=N[oI];if(on.type==='desk')return[pa,pb];
  const o=oI===a?pa:pb,lane=d.y+52+d.seat*9,end=[d.x,d.y+41];
  if(on.type==='hub')return[o,[o[0],lane],[d.x,lane],end];
  const rx=864+d.seat*10;return[o,[o[0],240],[rx,240],[rx,lane],[d.x,lane],end];}
 const ts=[A.type,B.type];
 if(ts.includes('router')&&ts.includes('main')){const pm=A.type==='main'?pa:pb,pr=A.type==='main'?pb:pa,mn=A.type==='main'?A:B;
  if(mn.x>800)return[pa,pb];const y=pm[1]+9;return[pm,[pm[0],y],[pr[0],y],pr];}
 if(FRONT(A.type)&&FRONT(B.type))return[pa,[pa[0],146],[pb[0],146],pb];
 if(A.type==='hub'&&B.type==='hub')return[pa,[pa[0],pb[1]],pb];

function analyze(N,edges,failed){const adj={};for(const id in N)adj[id]=[];
 edges.forEach(k=>{const[a,b]=k.split('|');if(a===failed||b===failed)return;adj[a].push(b);adj[b].push(a);});
 const depth={};if(failed!=='R'){depth.R=0;const q=['R'];while(q.length){const n=q.shift();for(const m of adj[n])if(!(m in depth)){depth[m]=depth[n]+1;q.push(m);}}}
 const reach=new Set(Object.keys(depth));let e=0;
 edges.forEach(k=>{const[a,b]=k.split('|');if(reach.has(a)&&reach.has(b))e++;});
 const loop=reach.size>0&&e>reach.size-1;
 const seen=new Set();let loopAny=false;
 for(const s in N){if(seen.has(s)||s===failed)continue;const comp=[s];seen.add(s);for(let i=0;i<comp.length;i++)for(const m of adj[comp[i]])if(!seen.has(m)){seen.add(m);comp.push(m);}
  const cs=new Set(comp);let ce=0;edges.forEach(k=>{const[a,b]=k.split('|');if(cs.has(a)&&cs.has(b))ce++;});if(ce>comp.length-1)loopAny=true;}
 return{reach,depth,loop,loopAny};}
function stopped(N,reach){let pcs=0,desks=0;for(const id in N)if(N[id].type==='desk'&&!reach.has(id)){pcs+=4;desks++;}return{pcs,desks,T:!reach.has('T'),P:!reach.has('P')};}

function Editor(el,N,o){
 const st={edges:new Set(),locked:new Set(o.locked||[]),sel:null,selCable:null,marks:new Set(),bad:new Set(),lamps:null,flow:false,failed:null,dim:null};
 const hist=[];let focusId=null;
 const deg=id=>{let n=0;st.edges.forEach(k=>{const[a,b]=k.split('|');if(a===id||b===id)n++;});return n;};
 const fire=n=>o[n]&&o[n]();
 function clearTest(){st.lamps=null;st.flow=false;st.bad=new Set();}
 function snap(){hist.push([...st.edges]);if(hist.length>80)hist.shift();}
 // 机と列ハブは同じ横列どうしだけを候補として示す（接続そのものは制限しない）
 function offRow(A,B){const d=A.type==='desk'?A:B.type==='desk'?B:null,h=A.type==='hub'&&A.line?A:B.type==='hub'&&B.line?B:null;return !!(d&&h&&d!==h&&d.line!==h.line);}
 function cands(){const s=new Set();if(o.mode!=='wire'||!o.nodeTap)return s;for(const id in N){if(st.sel){if(id!==st.sel&&!check(st.sel,id,key(st.sel,id))&&!(o.sameRow&&offRow(N[st.sel],N[id])))s.add(id);}else if(N[id].ports>1&&deg(id)<N[id].ports)s.add(id);}if(o.only)for(const id of [...s])if(!o.only(id))s.delete(id);return s;}
 function render(){st.cand=cands();el.innerHTML=mapSVG(N,st,o);if(focusId){const g=el.querySelector(`.node[data-id="${focusId}"]`);if(g)g.focus({preventScroll:true});focusId=null;}}
 function hint(t){o.onHint&&o.onHint(t);}
 function hintSel(){if(st.sel){const n=N[st.sel];hint(`${n.name}を選択中${n.ports>1?`（空きポート ${n.ports-deg(st.sel)}）`:''}。点線の枠の中から、接続先をタップしてください。`);}else if(st.selCable)hint(`選んだケーブル：${cableName(N,st.selCable)}。「選んだケーブルを外す」で外せます。`);else hint(o.defaultHint||'');}
 function check(a,b,k){const A=N[a],B=N[b];
  if(st.edges.has(k))return 'その2台は、既にケーブルで接続されています。';
  if(A.ports===1&&B.ports===1)return `${A.name}と${B.name}は、どちらも差し込み口が1つしかありません。ハブを経由して接続しましょう。`;
  if(deg(a)>=A.ports)return `${A.name}には、空いている差し込み口（ポート）がありません。`;
  if(deg(b)>=B.ports)return `${B.name}には、空いている差し込み口（ポート）がありません。`;
  return '';}
 function onNode(id){
  if(o.mode==='fail'){o.onFail&&o.onFail(id);return;}
  if(o.mode!=='wire')return;
  if(o.only&&id!==st.sel&&!o.only(id)){toast(o.onlyMsg||'点線の枠の機器をタップしてください。');return;}
  st.selCable=null;
  if(!st.sel)st.sel=id;
  else if(st.sel===id)st.sel=null;
  else{const a=st.sel,k=key(a,id);st.sel=null;const err=check(a,id,k);
   if(err)toast(err);else{snap();st.edges.add(k);clearTest();const keep=N[a].ports>1&&deg(a)<N[a].ports;if(keep)st.sel=a;toast(`${N[a].name} と ${N[id].name} を接続しました。`+(keep?`続けて${N[a].name}の接続先を選べます。`:''));fire('onChange');}}
  render();hintSel();fire('onSelect');}

  if(o.mode==='wire'){st.sel=null;st.selCable=st.selCable===k?null:k;render();hintSel();fire('onSelect');}}
 function clearSel(){if(!st.sel&&!st.selCable)return;st.sel=null;st.selCable=null;render();hintSel();fire('onSelect');}
 el.addEventListener('click',e=>{const c=e.target.closest('.cabhit');if(c){onCable(c.dataset.k);return;}const g=e.target.closest('.node');if(g&&!g.classList.contains('fixed')){onNode(g.dataset.id);return;}if(!g&&o.mode==='wire')clearSel();});
 el.addEventListener('keydown',e=>{if(e.key==='Escape')clearSel();});
 el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('.node');if(g&&!g.classList.contains('fixed')){e.preventDefault();focusId=g.dataset.id;onNode(g.dataset.id);}});

  canUndo:()=>hist.length>0,
  undo(){if(!hist.length)return;st.edges=new Set(hist.pop());st.sel=null;st.selCable=null;clearTest();render();hintSel();fire('onChange');fire('onSelect');},
  remove(k){if(st.locked.has(k)){toast('工事で敷設済みのケーブルは外せません。');return;}if(!st.edges.has(k))return;snap();st.edges.delete(k);if(st.selCable===k)st.selCable=null;st.marks.delete(k);clearTest();render();hintSel();fire('onChange');fire('onSelect');},
  toggleMark(k){onCable(k);},
  setEdges(e,keepHist){if(keepHist)snap();else hist.length=0;st.edges=new Set([...st.locked,...e]);st.sel=null;st.selCable=null;st.marks=new Set();clearTest();render();hintSel();},
  setTest(a,x){x=x||{};st.lamps={};for(const id in N){const n=N[id];if(n.type==='hub'&&deg(id)===0)continue;st.lamps[id]={on:a.reach.has(id)&&!a.loop,d:(a.depth[id]||0)*90};}
   st.bad=new Set(x.bad||[]);st.flow=!!x.flow;st.sel=null;st.selCable=null;render();}};
}

const S=Object.assign({cur:-1,practiced:false,pskip:false,ptests:0,done:[false,false,false],edges:[null,null,null],marks:[],tests:[0,0,0],submits:0,fails2:0,res:['','','']},store.get(KEY,{}));
const save=()=>store.set(KEY,S);
const opts={mode:'wire',sameRow:true,nodeTap:true,cableTap:true,defaultHint:'',onHint:t=>$('hint').textContent=t,onChange:changed,onSelect:toolbar,only:id=>S.cur>=0||pAllow(id),onlyMsg:'練習では、点線の枠の機器をタップしてください。'};
const ed=Editor($('room'),N,opts);
$('undo').innerHTML=icon('undo')+'元に戻す';$('cut').innerHTML=icon('cut')+'選んだケーブルを外す';$('copy').innerHTML=icon('copy')+'記録をコピー';

function changed(){S.dirty=true;if(S.cur>=0)S.edges[S.cur]=[...ed.st.edges];if(S.cur===1)S.marks=[...ed.st.marks];$('result').innerHTML='';save();side();}
function toolbar(){const w=opts.mode==='wire';$('undo').classList.toggle('hidden',!w);$('cut').classList.toggle('hidden',!(w&&ed.st.selCable));$('desel').classList.toggle('hidden',!(w&&ed.st.sel));$('clearMarks').classList.toggle('hidden',w);
 $('undo').disabled=!ed.canUndo();$('clearMarks').disabled=!ed.st.marks.size;guide();}
function guide(){const m=cm(),st=ed.st;let on=0,h='';
 const desks=Object.keys(N).filter(id=>N[id].type==='desk'),all=desks.every(d=>ed.deg(d)>0);
 if(S.cur<0){const rem=premain();on=!rem.length?2:(st.sel==='H1'?1:0);
  h=!rem.length?'3台とも接続できました。最後に、「通電テスト」を押してください。':st.sel!=='H1'?(rem.length<3?'もう一度、1列目ハブをタップしてから、残りの机をタップしてください。':'まず、1列目ハブ（点線の枠）をタップしてください。ケーブルを差す側（接続元）を先に選びます。'):(rem.length===3?'1列目ハブを選びました。次に、机1-1（点線の枠）をタップしてください。':`接続できました。1列目ハブを選んだままなので、続けて机${N[rem[0]].label}をタップしてください。`);}
 else if(S.cur===0){on=st.sel?1:(all?2:0);h=all?'全ての机が接続されました。図面と見比べてから「通電テスト」を押しましょう。':'見取り図で、接続元のハブ（点線の枠）をタップしてください。';}
 else if(S.cur===1){on=st.marks.size===0?0:(st.marks.size>=3?2:1);h=st.marks.size>=3?'印を付け終えたら「検査結果を提出する」を押しましょう。':'図面と違うと思うケーブルをタップすると、橙色の印が付きます。もう一度タップすると外れます。';}
 else{on=S.tests[2]===0?0:(st.sel||st.selCable||!S.dirty?1:2);h=S.tests[2]===0?'まず「通電テスト」を押して、今の状態を確かめましょう。':(S.dirty?'直し終えたら、もう一度「通電テスト」を押しましょう。':'ケーブルをタップすると外せます。機器をタップすると接続できます。');}
 opts.defaultHint=h;$('guideSteps').innerHTML=guideHTML(m.guide,on);if(S.cur<0&&!st.selCable||!st.sel&&!st.selCable)$('hint').textContent=h;}
function side(){const ks=sortKeys(N,[...ed.st.edges]);
 $('stats').innerHTML=`<span class="chip num">ケーブル ${ks.length}本</span>`+(cm().mode==='wire'?`<span class="chip num">通電テスト ${S.cur<0?S.ptests:S.tests[S.cur]}回</span>`:`<span class="chip num">印 ${ed.st.marks.size}本</span>`);
 $('cabcount').textContent=ks.length+'本';
 $('cabnote').textContent=opts.mode==='mark'?'見取り図で線を選びにくいときは、ここから印を付けられます。':'見取り図で線を選びにくいときは、ここから外せます。';
 $('cables').innerHTML=ks.map(k=>{const nm=esc(cableName(N,k));return `<li><span>${nm}</span>${opts.mode==='mark'?`<button class="btn" data-mark="${k}" aria-pressed="${ed.st.marks.has(k)}" aria-label="${nm}に印を付ける">${ed.st.marks.has(k)?'印あり':'印'}</button>`:`<button class="btn" data-cut="${k}" aria-label="${nm}を外す">外す</button>`}</li>`;}).join('');
 toolbar();}
function steps(){$('steps').innerHTML=`<button data-m="-1" class="${S.practiced?'done':''}"${S.cur<0?' aria-current="step"':''}><span class="n">${S.practiced?icon('check'):'練'}</span>練習</button>`+M.map((m,i)=>`<button data-m="${i}" class="${S.done[i]?'done':''}"${S.cur===i?' aria-current="step"':''}><span class="n">${S.done[i]?icon('check'):i+1}</span>${m.short}${S.done[i]?'<span class="sr">（完了）</span>':''}</button>`).join('');record();}
function card(){const m=cm();
 $('mission').innerHTML=`<div class="eyebrow">${S.cur<0?'操作の練習（約1分）':`仕事${S.cur+1}／3`}</div><h2>${m.title}</h2><p class="sub" style="margin-top:6px">${m.cond}</p><h3 style="margin-top:12px">やること</h3><ol class="todo">${m.todo.map(t=>`<li>${t}</li>`).join('')}</ol>
 <div class="actions"><button class="btn primary block" id="act">${icon(m.mode==='mark'?'flag':'bolt')}${m.action}</button>${S.cur<0?`<button class="btn block" id="skip">${icon('arrow')}練習をスキップして仕事1へ</button>`:''}<button class="btn block" id="reset">${icon('reset')}最初からやり直す</button></div><div id="result" aria-live="polite">${S.done[S.cur]?S.res[S.cur]:''}</div>`;
 $('act').onclick=S.cur<0?ptest:m.mode==='mark'?submit:test;
 $('act2').onclick=()=>{$('act').click();$('result').scrollIntoView({behavior:'smooth',block:'nearest'});};
 $('skip2').classList.toggle('hidden',S.cur>=0);if(S.cur<0)$('skip2').onclick=()=>$('skip').click();
 if(S.cur<0)$('skip').onclick=()=>{if(!S.practiced)S.pskip=true;S.practiced=true;load(0);toast('練習をスキップしました。「練習」はいつでも上から選べます。');};
 $('reset').onclick=()=>{ed.setEdges(m.init(),true);if(S.cur===1){S.marks=[];}$('result').innerHTML='';changed();toast('最初の状態に戻しました。「元に戻す」で取り消せます。');};
 bindNext();}
function bindNext(){const b=$('next');if(b)b.onclick=()=>{const n=S.done.findIndex(d=>!d);if(n<0){$('done').scrollIntoView({behavior:'smooth'});}else load(n);};}
function load(i){if(i!==S.cur&&S.cur>=0)S.edges[S.cur]=[...ed.st.edges];S.cur=i;const m=cm();
 opts.mode=m.mode;opts.nodeTap=m.mode==='wire';opts.cableTap=true;
 S.dirty=false;
 ed.setEdges(i<0?m.init():S.edges[i]||m.init());if(i===1){ed.st.marks=new Set(S.marks);ed.render();}
 $('cabcard').open=false;document.body.classList.toggle('m-mark',m.mode==='mark');document.body.classList.toggle('m-practice',i<0);
 $('act2').innerHTML=icon(m.mode==='mark'?'flag':'bolt')+m.action;
 $('diagram').innerHTML=diagramSVG(COUNTS,m.diag(),i<0?'練習のネットワーク図':'仕事'+(i+1)+'のネットワーク図');
 card();side();steps();save();window.scrollTo({top:0});}
function finish(html){S.done[S.cur]=true;const last=S.done.every(d=>d);
 html=html.replace('</div></div>',`</div></div>`);S.res[S.cur]=html;$('result').innerHTML=html+`<button class="btn primary block" id="next">${icon('arrow')}${last?'学習の記録を見る':'次の仕事へ'}</button>`;S.res[S.cur]=$('result').innerHTML;bindNext();steps();save();}
function ptest(){const a=analyze(N,ed.st.edges),s=stopped(N,a.reach),rem=premain();S.ptests++;S.dirty=false;
 if(rem.length){ed.setTest(a);$('result').innerHTML=resultHTML(false,'まだ接続できない机があります',`ランプが赤の机（${rem.map(d=>N[d].label).join('・')}）は、ケーブルが接続されていません。1列目ハブをタップしてから、机をタップしましょう。`);side();return;}
 ed.setTest(a,{flow:!(s.pcs||s.T||s.P)});const first=!S.practiced;S.practiced=true;S.pskip=false;
 $('result').innerHTML=resultHTML(true,'練習完了','全ての機器のランプが緑になり、インターネットに接続できました。','操作は「接続元のハブ → 接続先の机」の順にタップするだけです。間違えたときは「元に戻す」、ケーブルを外すときはケーブルをタップします。')+`<button class="btn primary block" id="next">${icon('arrow')}仕事1へ進む</button>`;
 $('next').onclick=()=>load(S.done.findIndex(d=>!d)<0?0:S.done.findIndex(d=>!d));steps();save();side();}
function test(){const i=S.cur,a=analyze(N,ed.st.edges),s=stopped(N,a.reach),unreached=s.pcs||s.T||s.P;S.tests[i]++;S.dirty=false;let html,ok=false,bad=[];
 if(a.loop)html=resultHTML(false,'通信が止まりました',i===0?'ハブ同士が輪の形（ループ）に接続されている区間があり、データが回り続けています。輪を作っているケーブルを探して外しましょう。':'ルータまでの経路は接続できましたが、輪の形（ループ）になっている区間があります。同じデータがハブの間を回り続けています。輪を作っているケーブルを外しましょう。');
 else if(unreached)html=resultHTML(false,'接続できない機器があります',`${stopText(s)}がインターネットに接続できません。`+(i===0?'ランプが赤の機器から、ルータまでの経路を順に確かめましょう。':'ランプが緑の機器と赤の機器の違いは何でしょうか。ルータから順に順に確かめましょう。'));
 else if(a.loopAny)html=resultHTML(false,'輪の形が残っています','どこにも接続されていない機器同士で、輪の形（ループ）ができています。');
 else if(i===0&&(bad=[...ed.st.edges].filter(k=>!TARGET.has(k))).length)html=resultHTML(false,'図面と違う配線があります',`全て接続できましたが、図面と違うケーブルが${bad.length}本あります（赤い破線）。図面どおりに直しましょう。`);
 else{ok=true;html=i===0?resultHTML(true,'施工完了','図面どおりに施工でき、全ての機器がインターネットに接続できました。','<b>ハブ</b>はケーブルの差し込み口を増やし、<b>ルータ</b>は教室の中のネットワークとインターネットを結び付けます。机のPCのデータは、机の配線口 → 列ハブ → 主ハブ → ルータの順に通ってインターネットへ出ていきます。')
  :resultHTML(true,'復旧完了','全ての機器がインターネットに接続できました。','図面の誤りは2つありました。<b>① 主ハブがルータに接続されておらず</b>、ルータには教師用PCだけが接続されていました。<b>② 1列目ハブと2列目ハブを直接接続する線</b>があり、主ハブと合わせて輪の形になっていました。輪があると同じデータが回り続け、ネットワーク全体が止まることがあります。');}
 ed.setTest(a,{bad,flow:ok});
 if(ok)finish(html);else{$('result').innerHTML=html;save();}side();}
function submit(){const mk=ed.st.marks;if(!mk.size){toast('図面と違うと思うケーブルに、印を付けてから提出してください。');return;}
 S.submits++;const hit=WRONG2.filter(k=>mk.has(k)).length,fp=[...mk].filter(k=>!WRONG2.includes(k)).length;
 if(hit===3&&fp===0){ed.st.marks=new Set();S.marks=[];ed.setTest({reach:new Set(),depth:{},loop:false},{bad:WRONG2});ed.st.lamps=null;ed.render();
  finish(resultHTML(true,'検査完了','図面と違う3本をすべて見つけました（赤い破線）。','机1-3と机4-2は、接続する列ハブが図面と違いました。教師用PCは、主ハブではなく1列目ハブに接続されていました。どれも通信はできますが、<b>図面と違う配線は、故障の原因を探す妨げになります。</b>この配線では、1列目ハブが故障すると教師用PCまで止まってしまいます。'));}
 else{S.fails2++;$('result').innerHTML=resultHTML(false,'再検査が必要です',`正しく見つけた誤りは3本中${hit}本です。図面と同じなのに印を付けたケーブルが${fp}本あります。`,S.fails2>=3?'<b>ヒント：</b>図面の各列ハブの下にある机と、見取り図で各列ハブに接続された机を比べましょう。教師用PCがどこに接続されているかも確かめましょう。':'');save();}
 side();}
function record(){const n=S.done.filter(d=>d).length;$('doneh').textContent=n===3?'3つの仕事をすべて終えました':`仕事 ${n}／3 が完了しています`;
 const st=i=>S.done[i]?'完了':'未完了';
 $('rec').textContent=`施工と検査（PC教室の配線）\n操作の練習：${S.practiced?(S.pskip?'スキップ':'完了'):'未実施'}\n仕事1　施工：${st(0)}（通電テスト ${S.tests[0]}回）\n仕事2　検査：${st(1)}（提出 ${S.submits}回）\n仕事3　不具合の調査：${st(2)}（通電テスト ${S.tests[2]}回）\n記録日時：${new Date().toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'})}`;}
$('steps').addEventListener('click',e=>{const b=e.target.closest('button[data-m]');if(b)load(+b.dataset.m);});
$('cables').addEventListener('click',e=>{const c=e.target.closest('[data-cut]');if(c){ed.remove(c.dataset.cut);return;}const m=e.target.closest('[data-mark]');if(m)ed.toggleMark(m.dataset.mark);});
$('undo').onclick=()=>ed.undo();
$('desel').onclick=()=>ed.clearSel();
$('cut').onclick=()=>{if(ed.st.selCable)ed.remove(ed.st.selCable);};
$('clearMarks').onclick=()=>{ed.st.marks=new Set();ed.render();changed();};
$('copy').onclick=()=>copyText($('rec').textContent,$('rec'));
load(!S.practiced&&!S.done.some(d=>d)?-1:Math.max(0,S.cur));
window.__app={N,TARGET,ed,S};
</script></body></html>
